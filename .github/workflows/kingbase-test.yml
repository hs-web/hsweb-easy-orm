name: Kingbase ORM tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  kingbase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Kingbase tests with Testcontainers
        run: >-
          mvn -U -B -pl hsweb-easy-orm-rdb -am
          '-Dtest=Kingbase*Test,Kingbase*Tests'
          -DfailIfNoTests=false
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dkingbase.testcontainers=true
          -Duser.timezone=Asia/Shanghai
          test
      - name: Upload Kingbase test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kingbase-test-reports
          path: hsweb-easy-orm-rdb/target/surefire-reports/
          if-no-files-found: ignore
